<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TaskWitness social preview</title>
  <desc id="desc">TaskWitness verifies AI coding work with evidence instead of claims.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110c"/>
      <stop offset="1" stop-color="#14271a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#52dd93" stop-opacity=".24"/>
      <stop offset="1" stop-color="#52dd93" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="945" cy="312" r="330" fill="url(#glow)"/>
  <path d="M0 548 C260 500 412 602 660 552 C866 510 1000 515 1200 574 V630 H0Z" fill="#52dd93" opacity=".055"/>

  <g transform="translate(76 82)">
    <rect width="194" height="40" rx="20" fill="#183524" stroke="#2f6845"/>
    <circle cx="24" cy="20" r="7" fill="#52dd93"/>
    <text x="43" y="26" fill="#c9f7dc" font-size="15" font-family="Inter, ui-sans-serif, system-ui" font-weight="700" letter-spacing="1.3">LOCAL-FIRST CLI</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <text x="76" y="190" fill="#f2faf5" font-size="72" font-weight="800" letter-spacing="-2">TaskWitness</text>
    <text x="76" y="255" fill="#52dd93" font-size="30" font-weight="750">AI writes the code.</text>
    <text x="76" y="297" fill="#f2faf5" font-size="30" font-weight="750">TaskWitness verifies the work.</text>
    <text x="76" y="365" fill="#a9b8ae" font-size="21">Evidence-backed completion reports for any coding agent.</text>
    <text x="76" y="404" fill="#a9b8ae" font-size="21">Baseline-aware · deterministic · no telemetry</text>
    <rect x="76" y="463" width="348" height="58" rx="12" fill="#52dd93"/>
    <text x="101" y="500" fill="#07110c" font-size="21" font-weight="800">No evidence = no green check.</text>
  </g>

  <g transform="translate(738 105)" filter="url(#shadow)">
    <path d="M175 0 323 52v124c0 119-67 205-148 254C94 381 27 295 27 176V52Z" fill="#101d14" stroke="#52dd93" stroke-width="6"/>
    <path d="m93 205 53 53 111-126" fill="none" stroke="#52dd93" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="298" cy="339" r="76" fill="#0b140e" stroke="#f2faf5" stroke-width="15"/>
    <line x1="352" y1="393" x2="402" y2="443" stroke="#f2faf5" stroke-width="20" stroke-linecap="round"/>
  </g>

  <text x="1124" y="587" text-anchor="end" fill="#6d8174" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">github.com/digsarab112/taskwitness</text>
</svg>
