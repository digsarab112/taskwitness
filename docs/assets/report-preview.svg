<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TaskWitness report preview</title>
  <desc id="desc">A dark terminal report catches a password-policy weakening even though tests pass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111814"/>
      <stop offset="1" stop-color="#07100b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#eaf0eb"/>
  <rect x="60" y="44" width="1080" height="612" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="91" cy="76" r="7" fill="#ff6b6b"/><circle cx="115" cy="76" r="7" fill="#ffd166"/><circle cx="139" cy="76" r="7" fill="#52dd93"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="92" y="132" fill="#52dd93" font-size="18" font-weight="800" letter-spacing="2">TASKWITNESS REPORT</text>
    <line x1="92" y1="152" x2="1108" y2="152" stroke="#2b3b31"/>
    <text x="92" y="194" fill="#7f9085" font-size="13" letter-spacing="1.5">TASK</text>
    <text x="92" y="224" fill="#eef7f1" font-size="20">Add Google login without changing existing authentication</text>
    <text x="92" y="276" fill="#7f9085" font-size="13" letter-spacing="1.5">VERDICT</text>
    <rect x="92" y="294" width="254" height="40" rx="20" fill="#3b171b"/>
    <text x="111" y="320" fill="#ff8181" font-size="15" font-weight="800">× VERIFICATION FAILED</text>
    <text x="92" y="380" fill="#52dd93" font-size="17">✓</text>
    <text x="122" y="380" fill="#eef7f1" font-size="16">R1  Google login implementation added</text>
    <text x="92" y="425" fill="#ffd16f" font-size="17">!</text>
    <text x="122" y="425" fill="#eef7f1" font-size="16">R2  Pre-existing password test was modified</text>
    <text x="122" y="448" fill="#86988c" font-size="13">Passing tests are no longer fully independent evidence.</text>
    <text x="92" y="500" fill="#ff8181" font-size="17">×</text>
    <text x="122" y="500" fill="#eef7f1" font-size="16">R3  Password policy was weakened</text>
    <text x="122" y="524" fill="#ff9b9b" font-size="13">src/auth/password.js  minimum length: 12 → 6</text>
    <line x1="92" y1="564" x2="1108" y2="564" stroke="#2b3b31"/>
    <text x="92" y="606" fill="#52dd93" font-size="16">✓ Tests passed</text>
    <text x="285" y="606" fill="#ff8181" font-size="16">Evidence still disagrees.</text>
  </g>
</svg>
